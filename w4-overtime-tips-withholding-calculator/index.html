<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W-4 Overtime & Tips Withholding</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.5;background:#f7f9fc;color:#172033} .card{background:#fff;border:1px solid #dfe9f4;border-radius:16px;padding:1.25rem;box-shadow:0 10px 22px rgba(15,23,42,.04)} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem} label{display:block;font-weight:700;margin-bottom:.5rem} input,button{font:inherit} input{width:100%;padding:.8rem .9rem;border:1px solid #dfe9f4;border-radius:10px;background:#fff;color:#172033} button{background:#1d4ed8;color:#fff;border:none;padding:.8rem 1rem;border-radius:10px;cursor:pointer;font-weight:700} a{color:#1d4ed8;text-decoration:none;font-weight:700} .result{margin-top:1rem;border:1px solid #dfe9f4;border-radius:12px;padding:1rem;background:#f9fbff} .small{font-size:.9rem;color:#58657d} @media (max-width:600px){body{margin:1rem auto;padding:0 .75rem}}</style>
</head>
<body>
  <h1>W-4 Overtime & Tips Withholding</h1>
  <div class="card">
    <div class="grid">
      <label>Extra overtime pay
        <input id="overtime" type="number" value="12000" min="0" step="250">
      </label>
      <label>Extra tip income
        <input id="tips" type="number" value="6000" min="0" step="250">
      </label>
    </div>
    <div style="margin-top:1rem"><button id="calc" type="button">Calculate</button> <a href="../" style="margin-left:.5rem">Back home</a></div>
    <div id="result" class="result"></div>
  </div>
  <script>
    function estimateTax(amount){
      const federallyTaxed = amount * 0.22;
      return federallyTaxed;
    }
    document.getElementById('calc').addEventListener('click', function(){
      const overtime = Number(document.getElementById('overtime').value) || 0;
      const tips = Number(document.getElementById('tips').value) || 0;
      const totalExtraPay = overtime + tips;
      const additionalWithholding = estimateTax(totalExtraPay);
      const fmt = (n)=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
      document.getElementById('result').innerHTML = `
        <strong>Estimated extra withholding:</strong> ${fmt(additionalWithholding)}<br>
        <span class="small">Combined extra pay: ${fmt(totalExtraPay)}</span>
      `;
    });
    document.getElementById('calc').click();
  </script>
</body>
</html>
