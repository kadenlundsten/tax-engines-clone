<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paycheck Calculator</title>
  <style>
    :root {
      --bg:#f5f7fb; --panel:#fff; --border:#dfe8f5; --text:#162033; --muted:#64748b; --accent:#0f6fff; --accent-soft:#eaf3ff; --good:#0a8f5d; --shadow:0 12px 32px rgba(15, 39, 82, 0.08);
    }
    *{box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;line-height:1.5;background:var(--bg);color:var(--text)}
    h1{margin:0 0 .4rem;font-size:2rem} .muted{color:var(--muted)}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:1.25rem;box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    .field{display:flex;flex-direction:column;gap:.35rem}
    label, .field-title{font-weight:700;font-size:.92rem}
    input, select{padding:.82rem .9rem;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:1rem}
    input:focus, select:focus{outline:2px solid rgba(15, 111, 255, .2);border-color:var(--accent)}
    .inline-row{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
    .inline-row .field{flex:1;min-width:160px}
    .actions{margin-top:1rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    button{background:var(--accent);color:#fff;border:none;padding:.8rem 1.15rem;border-radius:10px;font-weight:700;cursor:pointer}
    button.secondary{background:#eef3ff;color:var(--accent)}
    a.home{color:var(--accent);text-decoration:none;font-weight:700}
    .result{margin-top:1rem;border:1px solid var(--border);border-radius:12px;padding:1rem;background:linear-gradient(180deg,#f9fbff,#fff)}
    .result h2{margin:.1rem 0 .5rem;font-size:1.15rem}
    .big{font-size:2rem;font-weight:700;margin:.2rem 0}.small{font-size:.9rem;color:var(--muted)}
    .two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}
    .stat{background:#f8fbff;border:1px solid var(--border);border-radius:12px;padding:.85rem}
    .stat .label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
    .stat .value{font-size:1.35rem;font-weight:700;margin-top:.2rem}
    .section-tag{display:inline-block;margin-bottom:.5rem;padding:.3rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem}
    @media (max-width:600px){h1{font-size:1.6rem}.big{font-size:1.5rem}}
  </style>
</head>
<body>
  <h1>Paycheck Calculator</h1>
  <p class="muted">Estimate federal, state, FICA, and take-home pay with common payroll inputs.</p>

  <div class="card">
    <div class="grid">
      <div class="field">
        <label for="wageType">Pay type</label>
        <select id="wageType">
          <option value="salary">Salary</option>
          <option value="hourly">Hourly</option>
        </select>
      </div>

      <div class="field">
        <label for="salary">Annual salary</label>
        <input type="number" id="salary" value="95000" min="0" step="1000">
      </div>

      <div class="field">
        <label for="hourlyRate">Hourly rate</label>
        <input type="number" id="hourlyRate" value="45" min="0" step="0.25">
      </div>

      <div class="field">
        <label for="hoursPerWeek">Hours per week</label>
        <input type="number" id="hoursPerWeek" value="40" min="0" step="0.5">
      </div>

      <div class="field">
        <label for="state">State</label>
        <select id="state">
          <option value="US">Federal only</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA" selected>California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="IA">Iowa</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="MA">Massachusetts</option>
          <option value="MD">Maryland</option>
          <option value="ME">Maine</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MO">Missouri</option>
          <option value="MS">Mississippi</option>
          <option value="MT">Montana</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="NE">Nebraska</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NV">Nevada</option>
          <option value="NY">New York</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VA">Virginia</option>
          <option value="VT">Vermont</option>
          <option value="WA">Washington</option>
          <option value="WI">Wisconsin</option>
          <option value="WV">West Virginia</option>
          <option value="WY">Wyoming</option>
        </select>
      </div>

      <div class="field">
        <label for="filingStatus">Filing status</label>
        <select id="filingStatus">
          <option value="single" selected>Single</option>
          <option value="married_joint">Married filing jointly</option>
          <option value="married_separate">Married filing separately</option>
          <option value="head_household">Head of household</option>
        </select>
      </div>

      <div class="field">
        <label for="payFrequency">Pay frequency</label>
        <select id="payFrequency">
          <option value="annual">Annual</option>
          <option value="biweekly" selected>Biweekly</option>
          <option value="semimonthly">Semi-monthly</option>
          <option value="monthly">Monthly</option>
          <option value="weekly">Weekly</option>
        </select>
      </div>
    </div>

    <div class="section-tag">Payroll deductions &amp; adjustments</div>
    <div class="grid">
      <div class="field">
        <label for="preTax401k">401(k) contribution</label>
        <input type="number" id="preTax401k" value="7000" min="0" step="100">
      </div>
      <div class="field">
        <label for="preTaxCafeteria">HSA / FSA / health premiums</label>
        <input type="number" id="preTaxCafeteria" value="2500" min="0" step="100">
      </div>
      <div class="field">
        <label for="postTax">After-tax deductions</label>
        <input type="number" id="postTax" value="0" min="0" step="50">
      </div>
      <div class="field">
        <label for="dependents">Dependents / child tax credits</label>
        <input type="number" id="dependents" value="0" min="0" step="1">
      </div>
      <div class="field">
        <label for="extraWithholding">Extra federal withholding</label>
        <input type="number" id="extraWithholding" value="0" min="0" step="100">
      </div>
      <div class="field">
        <label for="bonus">Bonus / extra pay</label>
        <input type="number" id="bonus" value="0" min="0" step="500">
      </div>
    </div>

    <div class="actions">
      <button id="calc" type="button">Calculate paycheck</button>
      <button id="reset" class="secondary" type="button">Reset</button>
      <a class="home" href="../">Back home</a>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const PAY_PERIODS = { annual: 1, biweekly: 26, semimonthly: 24, monthly: 12, weekly: 52 };
    const FEDERAL_BRACKETS = {
      single: [[11000, 0.10], [44725, 0.12], [95375, 0.22], [182100, 0.24], [231250, 0.32], [578125, 0.35], [Infinity, 0.37]],
      married_joint: [[22000, 0.10], [89450, 0.12], [190750, 0.22], [364200, 0.24], [462638, 0.32], [693750, 0.35], [Infinity, 0.37]],
      married_separate: [[11000, 0.10], [44725, 0.12], [95375, 0.22], [182100, 0.24], [231250, 0.32], [346875, 0.35], [Infinity, 0.37]],
      head_household: [[15700, 0.10], [59850, 0.12], [95350, 0.22], [182100, 0.24], [231250, 0.32], [578125, 0.35], [Infinity, 0.37]]
    };
    const STANDARD_DEDUCTION = {
      single: 15000,
      married_joint: 30000,
      married_separate: 15000,
      head_household: 22500
    };
    const ADDL_MEDICARE_THRESHOLD = {
      single: 200000,
      married_joint: 250000,
      married_separate: 125000,
      head_household: 200000
    };
    const STATE_RATES = {
      US: 0,
      AL: 0,
      AK: 0,
      AZ: 0.025,
      AR: 0.04,
      CA: 0.093,
      CO: 0.044,
      CT: 0.03,
      DE: 0.022,
      FL: 0,
      GA: 0.053,
      HI: 0.014,
      IA: 0.034,
      ID: 0,
      IL: 0.0495,
      IN: 0.0323,
      KS: 0.049,
      KY: 0.05,
      LA: 0.04,
      MA: 0.05,
      MD: 0.05,
      ME: 0.058,
      MI: 0.0425,
      MN: 0.04875,
      MO: 0.043,
      MS: 0.04,
      MT: 0,
      NC: 0.0525,
      ND: 0.0225,
      NE: 0.024,
      NH: 0,
      NJ: 0.0525,
      NM: 0.03,
      NV: 0,
      NY: 0.052,
      OH: 0.028,
      OK: 0.04,
      OR: 0.09,
      PA: 0.0307,
      RI: 0.0375,
      SC: 0.06,
      SD: 0,
      TN: 0,
      TX: 0,
      UT: 0.048,
      VA: 0.05,
      VT: 0.033,
      WA: 0,
      WI: 0.0465,
      WV: 0.035,
      WY: 0
    };

    function progressiveTax(taxable, brackets) {
      if (taxable <= 0) return 0;
      let total = 0;
      let lower = 0;
      for (const [limit, rate] of brackets) {
        if (taxable <= lower) break;
        const slice = Math.min(taxable, limit) - lower;
        total += slice * rate;
        lower = limit;
      }
      return total;
    }

    function currency(n) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n || 0);
    }

    function getGrossAnnual() {
      const wageType = document.getElementById('wageType').value;
      const baseValue = Number(document.getElementById(wageType === 'salary' ? 'salary' : 'hourlyRate').value) || 0;
      if (wageType === 'salary') return baseValue;
      const hours = Number(document.getElementById('hoursPerWeek').value) || 0;
      return baseValue * hours * 52;
    }

    function updateWageFields() {
      const wageType = document.getElementById('wageType').value;
      const salaryField = document.getElementById('salary');
      const hourlyField = document.getElementById('hourlyRate');
      const hoursField = document.getElementById('hoursPerWeek');
      const salaryWrap = salaryField.closest('.field');
      const hourlyWrap = hourlyField.closest('.field');
      const hoursWrap = hoursField.closest('.field');

      if (wageType === 'salary') {
        salaryWrap.style.display = 'flex';
        hourlyWrap.style.display = 'none';
        hoursWrap.style.display = 'none';
      } else {
        salaryWrap.style.display = 'none';
        hourlyWrap.style.display = 'flex';
        hoursWrap.style.display = 'flex';
      }
    }

    function renderResult(data) {
      const gross = data.grossAnnual;
      const net = data.netAnnual;
      const payCheck = net / PAY_PERIODS[data.payFrequency];
      const total = data.totalTax;

      document.getElementById('result').innerHTML = `
        <h2>Estimated take-home pay</h2>
        <div class="big">${currency(payCheck)}</div>
        <div class="small">per ${data.payFrequency.replace('_', ' ')} paycheck</div>

        <div class="two-col">
          <div class="stat">
            <div class="label">Gross income</div>
            <div class="value">${currency(gross)}</div>
          </div>
          <div class="stat">
            <div class="label">Net annual pay</div>
            <div class="value">${currency(net)}</div>
          </div>
          <div class="stat">
            <div class="label">Federal tax</div>
            <div class="value">${currency(data.federalTax)}</div>
          </div>
          <div class="stat">
            <div class="label">State tax</div>
            <div class="value">${currency(data.stateTax)}</div>
          </div>
          <div class="stat">
            <div class="label">FICA</div>
            <div class="label">${currency(data.socialSecurity + data.medicare + data.additionalMedicare)}</div>
          </div>
          <div class="stat">
            <div class="label">Total taxes</div>
            <div class="value">${currency(total)}</div>
          </div>
        </div>

        <p class="small" style="margin-top:1rem; margin-bottom:0;">
          Filing status: ${data.filingStatusLabel} • State: ${data.state} • Deductions: ${currency(data.preTaxTotal + data.postTax)} • Extra withholding: ${currency(data.extraWithholding)}
        </p>
      `;
    }

    function calculatePaycheck() {
      const filingStatus = document.getElementById('filingStatus').value;
      const state = document.getElementById('state').value;
      const payFrequency = document.getElementById('payFrequency').value;
      const grossAnnual = getGrossAnnual() + (Number(document.getElementById('bonus').value) || 0);
      const retirement401k = Math.min(Number(document.getElementById('preTax401k').value) || 0, grossAnnual);
      const cafeteria125 = Math.min(Number(document.getElementById('preTaxCafeteria').value) || 0, grossAnnual);
      const postTax = Math.max(0, Number(document.getElementById('postTax').value) || 0);
      const dependentsCredit = Math.max(0, Number(document.getElementById('dependents').value) || 0) * 2000;
      const extraWithholding = Math.max(0, Number(document.getElementById('extraWithholding').value) || 0);

      const stdDeduction = STANDARD_DEDUCTION[filingStatus] || STANDARD_DEDUCTION.single;
      const brackets = FEDERAL_BRACKETS[filingStatus] || FEDERAL_BRACKETS.single;
      const taxableFederal = Math.max(0, grossAnnual - retirement401k - cafeteria125 - stdDeduction);
      const federalTax = Math.max(0, progressiveTax(taxableFederal, brackets) - dependentsCredit) + extraWithholding;

      const ssWages = Math.max(0, grossAnnual - cafeteria125);
      const socialSecurity = Math.min(ssWages, 176100) * 0.062;
      const medicare = ssWages * 0.0145;
      const additionalMedicare = Math.max(0, ssWages - ADDL_MEDICARE_THRESHOLD[filingStatus]) * 0.009;

      const stateRate = STATE_RATES[state] || 0;
      const stateTaxable = Math.max(0, grossAnnual - retirement401k - cafeteria125 - (state === 'US' ? grossAnnual : 0));
      const stateTax = state === 'US' ? 0 : Math.max(0, stateTaxable * stateRate);

      const preTaxTotal = retirement401k + cafeteria125;
      const totalTax = federalTax + socialSecurity + medicare + additionalMedicare + stateTax;
      const netAnnual = Math.max(0, grossAnnual - totalTax - preTaxTotal - postTax);

      renderResult({
        grossAnnual,
        netAnnual,
        federalTax,
        stateTax,
        socialSecurity,
        medicare,
        additionalMedicare,
        totalTax,
        preTaxTotal,
        postTax,
        extraWithholding,
        payFrequency,
        filingStatusLabel: document.getElementById('filingStatus').selectedOptions[0].text,
        state: document.getElementById('state').selectedOptions[0].text
      });
    }

    document.getElementById('wageType').addEventListener('change', updateWageFields);
    document.getElementById('calc').addEventListener('click', calculatePaycheck);
    document.getElementById('reset').addEventListener('click', function () {
      document.getElementById('wageType').value = 'salary';
      document.getElementById('salary').value = '95000';
      document.getElementById('hourlyRate').value = '45';
      document.getElementById('hoursPerWeek').value = '40';
      document.getElementById('state').value = 'CA';
      document.getElementById('filingStatus').value = 'single';
      document.getElementById('payFrequency').value = 'biweekly';
      document.getElementById('preTax401k').value = '7000';
      document.getElementById('preTaxCafeteria').value = '2500';
      document.getElementById('postTax').value = '0';
      document.getElementById('dependents').value = '0';
      document.getElementById('extraWithholding').value = '0';
      document.getElementById('bonus').value = '0';
      updateWageFields();
      calculatePaycheck();
    });

    updateWageFields();
    calculatePaycheck();
  </script>
</body>
</html>
