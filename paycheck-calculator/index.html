<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paycheck Calculator</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5;background:#f7f9fc;color:#172033} h1{margin-bottom:.3rem} .card{background:#fff;border:1px solid #dfe9f4;border-radius:16px;padding:1.25rem;box-shadow:0 10px 24px rgba(15,23,42,.04)} input,select{padding:.65rem .7rem;border:1px solid #d0d9ea;border-radius:10px;font-size:1rem} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}.result{margin-top:1.25rem;padding:1rem;border-radius:12px;background:#eef5ff;border:1px solid #cfe0ff}.small{color:#58657d;font-size:.95rem} .muted{color:#58657d}
  </style>
</head>
<body>
  <h1>Paycheck Calculator</h1>
  <p class="muted">Estimates for a single filer using 2026-style federal brackets, Social Security, and Medicare.</p>
  <div class="card">
    <div class="grid">
      <label>State
        <select id="state">
          <option value="FL">Florida</option>
          <option value="TX">Texas</option>
          <option value="CA" selected>California</option>
          <option value="NY">New York</option>
          <option value="PA">Pennsylvania</option>
          <option value="WA">Washington</option>
          <option value="MA">Massachusetts</option>
          <option value="GA">Georgia</option>
          <option value="IL">Illinois</option>
          <option value="NC">North Carolina</option>
          <option value="OH">Ohio</option>
          <option value="US">Federal-only</option>
        </select>
      </label>
      <label>Annual salary
        <input type="number" id="salary" value="85000" min="0" step="1000">
      </label>
      <label>Biweekly or monthly?
        <select id="freq">
          <option value="biweekly">Biweekly</option>
          <option value="monthly">Monthly</option>
          <option value="annual" selected>Annual</option>
        </select>
      </label>
    </div>
    <div style="margin-top:1rem"><button id="calc" type="button">Calculate</button> <a href="../" style="margin-left:.5rem">Back home</a></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const stateRates = {
      FL:0.00, TX:0.00, WA:0.00, CA:0.093, NY:0.052, PA:0.0307, MA:0.05, GA:0.053, IL:0.0495, NC:0.0525, OH:0.028, US:0.00
    };

    function progressiveTax(taxable, brackets){
      let tax=0; let prev=0;
      for (const [limit, rate] of brackets){
        if (taxable <= prev) break;
        const slice = Math.min(taxable, limit) - prev;
        tax += slice * rate;
        prev = limit;
      }
      return tax;
    }

    function estimateTaxes(salary){
      const standardDeduction = 15000;
      const taxable = Math.max(0, salary - standardDeduction);
      const fedBrackets = [[11000,0.10],[44725,0.12],[95375,0.22],[182100,0.24],[231250,0.32],[578125,0.35],[Infinity,0.37]];
      const federal = progressiveTax(taxable, fedBrackets);
      const ssCap = 176100;
      const ss = Math.min(salary, ssCap) * 0.062;
      const medicare = salary * 0.0145;
      return { federal, ss, medicare, total: federal + ss + medicare };
    }

    document.getElementById('calc').addEventListener('click', function(){
      const salary = Number(document.getElementById('salary').value) || 0;
      const state = document.getElementById('state').value;
      const freq = document.getElementById('freq').value;
      const { federal, ss, medicare, total } = estimateTaxes(salary);
      const stateTax = salary * (stateRates[state] || 0);
      const netAnnual = salary - total - stateTax;
      const pay = {
        annual: netAnnual,
        monthly: netAnnual / 12,
        biweekly: netAnnual / 26
      };
      const displayAmount = pay[freq];
      const formatted = (value) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(value);
      document.getElementById('result').innerHTML = `
        <strong>Estimated annual take-home pay:</strong> ${formatted(displayAmount)}<br>
        <span class="small">Federal income tax: ${formatted(federal)} • Social Security: ${formatted(ss)} • Medicare: ${formatted(medicare)} • State tax: ${formatted(stateTax)}</span><br>
        <span class="small">Estimated net annual pay: ${formatted(netAnnual)}</span>
      `;
    });
    document.getElementById('calc').click();
  </script>
</body>
</html>
